api_version = "2025-07"

[[extensions]]

uid = "293d114f-5b78-b574-c8ef-ad14806f3e60"

type = "ui_extension"
name = "Loyalty Points On Order"
handle = "order-rewards"

[[extensions.targeting]]
module = "./src/OrderIndex.jsx"
target = "customer-account.order-index.block.render"

[[extensions.targeting]]
module = "./src/OrderStatus.jsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
network_access = true
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "supabase_project_id"
type = "single_line_text_field"
name = "Supabase Project ID"
description = "Internal: jblqyvicxhmqqjhostcj (staging) or lizgppzyyljqbmzdytia (prod)"
default = "jblqyvicxhmqqjhostcj"

[[extensions.settings.fields]]
key = "heading_text"
type = "single_line_text_field"
name = "Heading Text"
description = "Heading for points earned section. Default: Points Earned on This Order"

[[extensions.settings.fields]]
key = "referral_reward_text"
type = "single_line_text_field"
name = "Referral Reward Text"
description = "e.g. '15% Off Coupon' shown in referral section"
