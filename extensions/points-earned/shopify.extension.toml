api_version = "2025-07"

[[extensions]]
uid = "47580161-e94e-1fee-f14d-2111f5807d13"
type = "ui_extension"
name = "Loyalty Points On Order"
handle = "order-status-rewards"

[[extensions.targeting]]
module = "./src/index.jsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/OrderStatus.jsx"
export = "forOrderStatus"
target = "customer-account.order-status.block.render"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
export = "default"
target = "purchase.checkout.block.render"

[extensions.capabilities]
network_access = true
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "heading_text"
type = "single_line_text_field"
name = "Heading Text"
description = "Shown above the points count on the thank-you / order-status page. Default: Rewards Earned on This Order"

[[extensions.settings.fields]]
key = "checkout_heading_text"
type = "single_line_text_field"
name = "Checkout Heading Text"
description = "Shown above the points preview during checkout. Default: Your rewards on this order"

[[extensions.settings.fields]]
key = "template"
type = "single_line_text_field"
name = "Layout Template"
description = "banner = coloured card (default) · minimal = plain receipt-style · compact = single inline line"

[[extensions.settings.fields.validations]]
name = "choices"
value = '["banner", "minimal", "compact"]'

[[extensions.settings.fields]]
key = "banner_tone"
type = "single_line_text_field"
name = "Banner Colour"
description = "Colour of the banner card (used when template is banner). Ignored for minimal."

[[extensions.settings.fields.validations]]
name = "choices"
value = '["success", "info", "warning"]'

[[extensions.settings.fields]]
key = "show_balance"
type = "boolean"
name = "Show Points Balance"
description = "Show 'Your new balance after fulfilment: X Points' line"

[[extensions.settings.fields]]
key = "show_fulfilled_note"
type = "boolean"
name = "Show Fulfilment Note"
description = "Show 'Points are credited once your order is fulfilled' note"

[[extensions.settings.fields]]
key = "text_alignment"
type = "single_line_text_field"
name = "Text Alignment"
description = "Alignment of all content within the block"

[[extensions.settings.fields.validations]]
name = "choices"
value = '["start", "center", "end"]'

[[extensions.settings.fields]]
key = "signin_button_style"
type = "single_line_text_field"
name = "Sign-in Button Style"
description = "Style of the 'Sign in' button shown to guest customers"

[[extensions.settings.fields.validations]]
name = "choices"
value = '["primary", "secondary", "plain"]'

[[extensions.settings.fields]]
key = "signin_button_text"
type = "single_line_text_field"
name = "Sign-in Button Text"
description = "Label on the sign-in button. Default: Sign in to your account"
