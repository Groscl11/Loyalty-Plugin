api_version = "2025-07"

[[extensions]]

uid = "96fdc49e-c192-b44f-8227-2bcb72a92a7f65a975f9"

type = "ui_extension"
name = "Post Purchase Rewards"
handle = "campaign-reward-banner"

[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/OrderStatus.jsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
network_access = true
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "campaign_id"
type = "single_line_text_field"
name = "Campaign ID"
description = "The GoSelf campaign ID whose rewards should be promoted. Find it in GoSelf Admin → Campaigns."

[[extensions.settings.fields]]
key = "banner_body"
type = "multi_line_text_field"
name = "Banner Message"
description = "Message shown to the customer. e.g. 'Unlock Huge Savings! Grab your exclusive voucher and get up to 80% Off from our Partner brands.'"

[[extensions.settings.fields]]
key = "button_text"
type = "single_line_text_field"
name = "Button Label"
description = "Text on the Claim button. Default: Claim Now"

[[extensions.settings.fields]]
key = "template"
type = "single_line_text_field"
name = "Layout Template"
description = "inline = icon + text + button in a row (default) · banner = coloured card with full-width button · minimal = plain stacked text + button"

[[extensions.settings.fields.validations]]
name = "choices"
value = '["inline", "banner", "minimal"]'

[[extensions.settings.fields]]
key = "banner_tone"
type = "single_line_text_field"
name = "Banner Colour"
description = "Colour of the card (used when template is banner). Ignored for inline and minimal."

[[extensions.settings.fields.validations]]
name = "choices"
value = '["success", "info", "warning"]'

[[extensions.settings.fields]]
key = "button_style"
type = "single_line_text_field"
name = "Button Style"
description = "primary = filled (theme colour, default) · secondary = outlined · plain = text link"

[[extensions.settings.fields.validations]]
name = "choices"
value = '["primary", "secondary", "plain"]'

[[extensions.settings.fields]]
key = "text_alignment"
type = "single_line_text_field"
name = "Text Alignment"
description = "Alignment of all content within the block"

[[extensions.settings.fields.validations]]
name = "choices"
value = '["start", "center", "end"]'

