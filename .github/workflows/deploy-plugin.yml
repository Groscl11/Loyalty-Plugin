name: Deploy Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Build widget and deploy Shopify extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build:widget
        env:
          NODE_ENV: production

      - name: Deploy Shopify extensions
        run: npx shopify app deploy --force
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}

      - name: Tag summary
        run: echo "Deployed plugin version ${{ github.ref_name }} to Shopify"
