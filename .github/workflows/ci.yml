name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-widget:
    name: Build widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build widget (production)
        run: npm run build:widget
        env:
          NODE_ENV: production

      - name: Confirm output exists
        run: test -f extensions/loyalty-widget/assets/loyalty-widget-v6.js && echo "Widget built successfully"
