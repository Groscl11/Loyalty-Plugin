api_version = "2024-10"

[[extensions]]
type = "checkout.order-status.block.render"
name = "Show Points Earned On This Order"
handle = "order-status-rewards"

[[extensions.targeting]]
target = "purchase.order-status.block.render"

[extensions.capabilities]
network_access = true
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "heading_text"
type = "single_line_text_field"
name = "Heading Text"
description = "Shown above the points count. Default: 'Points Earned on This Order'"

[[extensions.settings.fields]]
key = "referral_reward_text"
type = "single_line_text_field"
name = "Referral Reward Text (guest prompt)"
description = "e.g. '15% Off Coupon' — shown to guest users in the login prompt"
