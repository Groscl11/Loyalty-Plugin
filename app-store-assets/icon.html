<link rel="stylesheet" href="_shared.css">
<style>
  html,body{width:1200px;height:1200px}
  .wrap{width:1200px;height:1200px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(140deg,#6366f1 0%,#4338ca 55%,#3730a3 100%);position:relative;overflow:hidden}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);top:-160px;right:-160px}
  .badge{width:560px;height:560px;border-radius:150px;background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.35);backdrop-filter:blur(2px);position:relative}
  .coin{width:360px;height:360px;border-radius:50%;
    background:linear-gradient(150deg,#fde68a 0%,#f59e0b 60%,#d97706 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 24px 60px -12px rgba(217,119,6,.6),inset 0 6px 20px rgba(255,255,255,.5),inset 0 -12px 30px rgba(180,83,9,.4)}
  .coin .g{font-family:var(--font);font-weight:800;font-size:230px;color:#78350f;line-height:1;margin-top:-8px}
  .spark{position:absolute;color:#fff;font-weight:800;text-shadow:0 2px 12px rgba(99,102,241,.5)}
  .s1{font-size:60px;top:360px;left:360px;opacity:.92}
  .s2{font-size:40px;bottom:360px;left:410px;opacity:.7}
  .s3{font-size:50px;top:400px;right:350px;opacity:.85}
</style>
<div class="wrap">
  <div class="glow"></div>
  <div class="badge">
    <div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">✦</div>
    <div class="coin"><div class="g">g</div></div>
  </div>
</div>
