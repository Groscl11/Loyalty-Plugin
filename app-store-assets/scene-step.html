<link rel="stylesheet" href="_shared.css">
<style>
  html,body{width:1600px;height:900px}
  .s{width:1600px;height:900px;background:#0f0d2b;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;text-align:center;position:relative;overflow:hidden}
  .glow{position:absolute;width:800px;height:800px;border-radius:50%;
    background:radial-gradient(circle,rgba(99,102,241,.45),transparent 68%)}
  .num{font-size:150px;font-weight:800;color:#818cf8;line-height:1;z-index:2}
  h2{font-size:52px;font-weight:800;letter-spacing:-1px;margin-top:14px;z-index:2;max-width:1100px}
  p{font-size:24px;color:#a5b4fc;margin-top:20px;z-index:2;max-width:820px;line-height:1.5}
</style>
<div class="s">
  <div class="glow"></div>
  <div class="num" id="num">1</div>
  <h2 id="title">Set up your program in minutes</h2>
  <p id="sub">Choose how customers earn points and what rewards they can unlock.</p>
</div>
<script>
  const p = new URLSearchParams(location.search);
  if(p.get('n')) num.textContent = p.get('n');
  if(p.get('t')) title.textContent = p.get('t');
  if(p.get('s')) sub.textContent = p.get('s');
</script>
