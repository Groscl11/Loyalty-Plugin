# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3290e6e4e5cb6711e4a7876ef40f87e8"
name = "Loyalty by Goself"
# Embedded managed-install bootstrap (see shopify-token-exchange + /shopify/install).
application_url = "https://app.goself.in/shopify/install"
# embedded = true REQUIRED for App Bridge session tokens used by token exchange.
embedded = true

[webhooks]
api_version = "2026-01"

# H-17: all 5 topics declared so they survive reinstall without relying solely
# on programmatic registration in the OAuth callback
[[webhooks.subscriptions]]
  topics = ["orders/create", "orders/paid", "orders/updated", "customers/create", "customers/update"]
  uri = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-order-webhook"

# GDPR mandatory compliance webhooks (required for Shopify App Store submission)
[webhooks.privacy_compliance]
  customer_data_request_url = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-customers-data-request"
  customer_deletion_url     = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-customers-redact"
  shop_deletion_url         = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-shop-redact"

[access_scopes]
# Minimal scopes required for loyalty program functionality:
#   read_customers  — look up customer records to match loyalty members
#   read_orders     — receive order webhooks and read order history
#   read_discounts  — check existing discount codes before issuing rewards
#   write_discounts — create discount codes for point redemptions
scopes = "read_customers,read_orders,read_discounts,write_discounts,read_price_rules,write_price_rules"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-oauth-callback"
]

[[extensions]]
type = "theme"
name = "Loyalty Rewards Widget"
handle = "loyalty-widget"
directory = "extensions/loyalty-widget"

[[extensions]]
type = "ui_extension"
name = "Referral Widget"
handle = "referral-widget"
directory = "extensions/referral-widget"

[[extensions]]
type = "ui_extension"
name = "Show Points Earned On This Order"
handle = "order-status-rewards"
directory = "extensions/points-earned"

[[extensions]]
type = "ui_extension"
name = "Post Purchase Rewards"
handle = "campaign-reward-banner"
directory = "extensions/campaign-reward-banner"
