# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3290e6e4e5cb6711e4a7876ef40f87e8"
name = " Loyalty by Goself"
application_url = "https://goself.netlify.app"
embedded = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/paid"]
  uri = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-order-webhook"

  # GDPR mandatory webhooks (required for Shopify App Store submission)
  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-customers-data-request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-customers-redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-shop-redact"

[access_scopes]
# Minimal scopes required for loyalty program functionality:
#   read_customers  — look up customer records to match loyalty members
#   read_orders     — receive order webhooks and read order history
#   read_discounts  — check existing discount codes before issuing rewards
#   write_discounts — create discount codes for point redemptions
scopes = "read_customers,read_orders,read_discounts,write_discounts"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://lizgppzyyljqbmzdytia.supabase.co/functions/v1/shopify-oauth-callback"
]

[[extensions]]
type = "theme"
name = "Loyalty Rewards Widget"
handle = "loyalty-widget"
directory = "extensions/loyalty-widget"

[[extensions]]
type = "ui_extension"
name = "Referral Widget"
handle = "referral-widget"
directory = "extensions/referral-widget"

[[extensions]]
type = "ui_extension"
name = "Show Points Earned On This Order"
handle = "order-status-rewards"
directory = "extensions/points-earned"

[[extensions]]
type = "ui_extension"
name = "Order Rewards & Referral"
handle = "order-rewards"
directory = "extensions/order-rewards"
